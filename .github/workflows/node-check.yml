name: Node.js セキュリティ更新の検証

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (deploy.yml と同じ版)
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: node --version
      - run: npm ci
      - run: npm run build
